<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 70%;
            border-collapse: collapse;
            margin: 30px auto;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #333;
            color: white;
            width: 250px;
        }

        .Aprovado {
            color: green;
            font-weight: bold;
        }

        .Reprovado {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
   
    <h1 style="text-align: center;">Lista de Alunos</h1>

        <ol>
            <li>João Silva - 8,5 - <span class="Aprovado">Aprovado</span></li>
            <li>Maria Santos - 9,0 - <span class="Aprovado">Aprovado</span></li>
            <li>Pedro Silva - 5,0 - <span class="Reprovado">Reprovado</span></li>
            <li>Ana Costa - 7,0 - <span class="Aprovado">Aprovado</span></li>
            <li>Lucas Sousa - 4,5 - <span class="Reprovado">Reprovado</span></li>
        </ol>


</body>

</html>
